<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bố Cục 3 Cột với Bootstrap</title>

    <!-- Bootstrap 5.3.0 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-4 text-center">
        <h1>Bố Cục 3 Cột với Bootstrap</h1>
    </div>

    <!-- 2. CẤU TRÚC GRID 3 CỘT -->
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-4 d-flex justify-content-center align-items-center bg-light p-3">
                Phần 1
            </div>
            <div class="col-md-4 d-flex justify-content-center align-items-center bg-secondary p-3 text-white">
                Phần 2
            </div>
            <div class="col-md-4 d-flex justify-content-center align-items-center bg-light p-3">
                Phần 3
            </div>
        </div>
    </div>

    <!-- 3. MARGIN & PADDING -->
    <div class="container my-5 py-3">
        <h3 class="text-center">
            Khoảng cách được điều chỉnh bằng Margin & Padding
        </h3>
    </div>

    <!-- 4. DISPLAY PROPERTY -->
    <div class="d-none d-md-block bg-warning text-center p-3">
        <p class="mb-0">Nội dung này chỉ hiển thị trên màn hình lớn hơn 768px</p>
    </div>

    <!-- Bootstrap 5.3.0 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
