<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Box Model 1</title>

    <style>
        div {
            margin: 25px;
            padding: 35px;
            width: 200px;
            background-color: lightseagreen;
            border: 20px dashed indianred;
        }
    </style>
</head>

<body>

    <div>
        Content demo box<br/>
    </div>

    <!-- 
    GHI CHÚ:
    Tổng chiều rộng của phần tử div này được tính theo công thức:
    width + left/right padding + left/right border + left/right margin
    = 200 + (35 * 2) + (20 * 2) + (25 * 2)
    = 200 + 70 + 40 + 50
    = 360px
    -->

</body>
</html>
