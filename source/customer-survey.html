<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Research Survey</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            line-height: 1.6;
        }

        .survey-container {
            max-width: 700px;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .description {
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
            border-bottom: 1px solid #ccc;
            padding-bottom: 15px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label.question {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
        }

        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .radio-group, .checkbox-group {
            margin-bottom: 10px;
        }

        .radio-group label, .checkbox-group label {
            margin-left: 5px;
        }

        .price-group {
            display: flex;
            align-items: center;
        }

        .price-group span {
            margin: 0 5px;
            font-weight: bold;
        }

        .price-group input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .price-group .dollars {
            width: 80px;
        }

        .price-group .cents {
            width: 50px;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            resize: vertical;
        }

        table.rating-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        table.rating-table th, table.rating-table td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        table.rating-table th {
            background-color: #f9f9f9;
        }

        table.rating-table td:first-child {
            text-align: left;
            width: 40%;
        }

        .buttons {
            margin-top: 30px;
            text-align: center;
        }

        input[type="submit"], input[type="reset"] {
            padding: 10px 20px;
            font-size: 16px;
            margin: 0 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        input[type="submit"] {
            background-color: #5cb85c;
            color: white;
        }

        input[type="reset"] {
            background-color: #ccc;
        }
    </style>
</head>

<body>

<div class="survey-container">

    <h1>Market Research Survey</h1>
    <div class="description">Please take a few moments to complete this satisfaction survey.</div>

    <form method="POST" action="#">
        
        <!-- Age Range -->
        <div class="form-group">
            <label class="question" for="age">What is your age range?</label>
            <select id="age" name="age">
                <option value="under_18">Under 18</option>
                <option value="18_24">18-24</option>
                <option value="25_34">25-34</option>
                <option value="35_44">35-44</option>
                <option value="45_54">45-54</option>
                <option value="55_64">55-64</option>
                <option value="65_older">65 or older</option>
            </select>
        </div>

        <!-- Yearly Income -->
        <div class="form-group">
            <label class="question" for="income">What is your yearly income range?</label>
            <select id="income" name="income">
                <option value="under_25k">Under $25,000</option>
                <option value="25k_49k">$25,000 - $49,999</option>
                <option value="50k_74k">$50,000 - $74,999</option>
                <option value="75k_99k">$75,000 - $99,999</option>
                <option value="100k_more">$100,000 or more</option>
            </select>
        </div>

        <!-- Gender Identity -->
        <div class="form-group">
            <label class="question">Gender Identity</label>
            <div class="radio-group">
                <input type="radio" id="gender_male" name="gender" value="Male">
                <label for="gender_male">Male</label>
            </div>
            <div class="radio-group">
                <input type="radio" id="gender_female" name="gender" value="Female">
                <label for="gender_female">Female</label>
            </div>
            <div class="radio-group">
                <input type="radio" id="gender_nonbinary" name="gender" value="Nonbinary">
                <label for="gender_nonbinary">Nonbinary</label>
            </div>
            <div class="radio-group">
                <input type="radio" id="gender_other" name="gender" value="Other">
                <label for="gender_other">Other</label>
                <input type="text" name="gender_other_text" placeholder="Please specify">
            </div>
        </div>

        <!-- Products Purchased -->
        <div class="form-group">
            <label class="question">Which of the following products have your purchased in the last 2 months. Please check all that apply.</label>
            <div class="checkbox-group">
                <input type="checkbox" id="product1" name="products" value="Product 1">
                <label for="product1">Product 1</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="product2" name="products" value="Product 2">
                <label for="product2">Product 2</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="product3" name="products" value="Product 3">
                <label for="product3">Product 3</label>
            </div>
        </div>

        <!-- Product Usage Frequency -->
        <div class="form-group">
            <label class="question">How often would you use our new product?</label>
            <div class="radio-group">
                <input type="radio" id="freq_daily" name="frequency" value="Daily">
                <label for="freq_daily">Daily</label>
            </div>
            <div class="radio-group">
                <input type="radio" id="freq_weekly" name="frequency" value="Weekly">
                <label for="freq_weekly">Weekly</label>
            </div>
            <div class="radio-group">
                <input type="radio" id="freq_monthly" name="frequency" value="Monthly">
                <label for="freq_monthly">Monthly</label>
            </div>
        </div>

        <!-- Price -->
        <div class="form-group">
            <label class="question">What would you pay for the new product?</label>
            <div class="price-group">
                <span>$</span>
                <input type="text" class="dollars" name="price_dollars" placeholder="Dollars">
                <span>.</span>
                <input type="text" class="cents" name="price_cents" placeholder="Cents" maxlength="2">
            </div>
        </div>

        <!-- Desired Features -->
        <div class="form-group">
            <label class="question" for="features">What features would you like to see in the new product.</label>
            <textarea id="features" name="features" placeholder="Enter your answer here..."></textarea>
        </div>

        <!-- Agreement Rating Table -->
        <div class="form-group">
            <label class="question">Please rate your level of agreement with the following statements.</label>
            <table class="rating-table">
                <thead>
                    <tr>
                        <th></th>
                        <th>Strongly Disagree</th>
                        <th>Disagree</th>
                        <th>Agree</th>
                        <th>Strongly Agree</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Our products are priced fairly.</td>
                        <td><input type="radio" name="rate_price" value="Strongly Disagree"></td>
                        <td><input type="radio" name="rate_price" value="Disagree"></td>
                        <td><input type="radio" name="rate_price" value="Agree"></td>
                        <td><input type="radio" name="rate_price" value="Strongly Agree"></td>
                    </tr>
                    <tr>
                        <td>Our products are high quality.</td>
                        <td><input type="radio" name="rate_quality" value="Strongly Disagree"></td>
                        <td><input type="radio" name="rate_quality" value="Disagree"></td>
                        <td><input type="radio" name="rate_quality" value="Agree"></td>
                        <td><input type="radio" name="rate_quality" value="Strongly Agree"></td>
                    </tr>
                    <tr>
                        <td>You would recommend our product to a friend or coworker.</td>
                        <td><input type="radio" name="rate_recommend" value="Strongly Disagree"></td>
                        <td><input type="radio" name="rate_recommend" value="Disagree"></td>
                        <td><input type="radio" name="rate_recommend" value="Agree"></td>
                        <td><input type="radio" name="rate_recommend" value="Strongly Agree"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Submit / Reset -->
        <div class="buttons">
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
        </div>

    </form>

</div>

</body>
</html>
