<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Column Start</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>CSS Grid - grid-column-start</h1>

    <h2>Ví dụ 1: Giá trị auto</h2>

    <div class="grid auto-example">
        <div>Ô 1</div>
        <div class="auto-item">Ô 2 - auto</div>
        <div>Ô 3</div>
        <div>Ô 4</div>
    </div>

    <h2>Ví dụ 2: Giá trị span n</h2>

    <div class="grid span-example">
        <div>Ô 1</div>
        <div class="span-item">Ô 2 - span 2</div>
        <div>Ô 3</div>
        <div>Ô 4</div>
    </div>

    <h2>Ví dụ 3: Giá trị column-line</h2>

    <div class="grid line-example">
        <div>Ô 1</div>
        <div class="line-item">Ô 2 - bắt đầu từ cột 2</div>
        <div>Ô 3</div>
        <div>Ô 4</div>
    </div>

</body>
</html>
