<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Row</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>CSS Grid - grid-row</h1>

    <h2>Ví dụ 1: grid-row với row-start và row-end</h2>

    <div class="grid example-1">
        <div>Ô 1</div>
        <div class="item-1">Ô 2 - grid-row: 1 / 3</div>
        <div>Ô 3</div>
        <div>Ô 4</div>
        <div>Ô 5</div>
        <div>Ô 6</div>
    </div>

    <h2>Ví dụ 2: grid-row với span</h2>

    <div class="grid example-2">
        <div>Ô 1</div>
        <div class="item-2">Ô 2 - grid-row: 2 / span 2</div>
        <div>Ô 3</div>
        <div>Ô 4</div>
        <div>Ô 5</div>
        <div>Ô 6</div>
    </div>

</body>
</html>
